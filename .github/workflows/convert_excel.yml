name: Chuyển Excel sang .xlsx
# Power Automate gọi workflow này (repository_dispatch, event_type = convert-excel) sau khi lưu file đính kèm.
# client_payload: {"site": "tiennm", "path": "C5-Insight/07_dms_mo/ten file.xlsb", "source_action": "move"}
# File không đi qua repo: chỉ tải về máy chạy GitHub, đổi, rồi ghi lại SharePoint.
on:
  repository_dispatch:
    types: [convert-excel]
  workflow_dispatch:
    inputs:
      site:
        description: 'Site SharePoint (tên hoặc link đầy đủ). Để trống = OneDrive cá nhân'
        default: 'tiennm'
        required: false
      path:
        description: "Thư mục (đổi mọi file .xls/.xlsb/.xlsm trong đó) hoặc 1 file, vd C5-Insight/07_dms_mo. Dán đường dẫn trên máy cũng được"
        required: true
      source_action:
        description: 'File gốc: move (vào _goc), delete, keep'
        default: 'move'
        required: false
      mode:
        description: 'full = giữ công thức, định dạng (LibreOffice); values = chỉ giá trị'
        default: 'full'
        required: false

concurrency:
  group: convert-excel-${{ github.event.client_payload.path || inputs.path }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            excel_convert.py
            convert_sharepoint.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install python-calamine openpyxl lxml msal requests

      - name: Cài LibreOffice bản mới nhất (để giữ công thức, định dạng)
        # Bản 24.2 có sẵn trên Ubuntu đọc sai hàm XLOOKUP trong .xlsb, nên tải bản mới nhất.
        # Nếu tải lỗi, bước đổi sẽ tự dùng bản chỉ giá trị.
        continue-on-error: true
        run: |
          V=$(curl -fsL https://download.documentfoundation.org/libreoffice/stable/ | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "LibreOffice $V"
          curl -fsSL -o lo.tgz "https://download.documentfoundation.org/libreoffice/stable/$V/deb/x86_64/LibreOffice_${V}_Linux_x86-64_deb.tar.gz"
          tar xzf lo.tgz
          sudo dpkg -i LibreOffice_*_deb/DEBS/*.deb > /dev/null
          ls -d /opt/libreoffice*/program/soffice

      - name: Đổi sang .xlsx
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SRC_SITE: ${{ github.event.client_payload.site || inputs.site }}
          SRC_PATH: ${{ github.event.client_payload.path || inputs.path }}
          SOURCE_ACTION: ${{ github.event.client_payload.source_action || inputs.source_action }}
          CONVERT_MODE: ${{ github.event.client_payload.mode || inputs.mode }}
        run: python convert_sharepoint.py
