name: Process Excel to CSV
on:
  push:
    paths:
      - 'DMS_Input.xlsx'

jobs:
  convert_to_csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl msal requests

      - name: Chạy Script xử lý file
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python extract_data.py

      - name: Commit CSV file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Chỉ commit nếu file tồn tại
          if [ -f "output.csv" ]; then
            git add output.csv
            git commit -m "Auto-generate output.csv from DMS_Input.xlsx"
            git push
          else
            echo "output.csv không tìm thấy, bỏ qua commit."
          fi
