name: Process Excel to CSV
on:
  push:
    paths:
      - 'DMS_Input.xlsx'
      - 'DMS_Input.xlsb'
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công trên GitHub

jobs:
  convert_to_csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện
        run: |
          pip install python-calamine openpyxl lxml msal requests pymupdf pillow

      - name: Cài LibreOffice bản mới nhất (để giữ công thức, định dạng)
        # Bản 24.2 có sẵn trên Ubuntu đọc sai hàm XLOOKUP trong .xlsb, nên tải bản mới nhất.
        # Nếu tải lỗi, bước đổi sẽ tự dùng bản chỉ giá trị.
        continue-on-error: true
        run: |
          V=$(curl -fsL https://download.documentfoundation.org/libreoffice/stable/ | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "LibreOffice $V"
          curl -fsSL -o lo.tgz "https://download.documentfoundation.org/libreoffice/stable/$V/deb/x86_64/LibreOffice_${V}_Linux_x86-64_deb.tar.gz"
          tar xzf lo.tgz
          sudo dpkg -i LibreOffice_*_deb/DEBS/*.deb > /dev/null
          ls -d /opt/libreoffice*/program/soffice

      - name: Chuyển DMS sang .xlsx cho Power BI
        # Lỗi ở bước này không chặn các bước dán dữ liệu, tạo ảnh, gửi Zalo
        continue-on-error: true
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          PBI_SITE: tiennm
          PBI_OUTPUT_PATH: C5-Insight/07_dms_mo/DMS CBD.xlsx
        run: python convert_to_xlsx.py

      - name: Chạy Script xử lý file
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python extract_data.py

      - name: Tạo ảnh Phú Yên, Sông Cầu
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python make_images.py

      - name: Gửi ảnh lên Zalo
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_IDS: ${{ secrets.ZALO_CHAT_IDS }}
        run: python send_zalo.py
