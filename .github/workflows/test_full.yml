name: TEST convert full (tạm, sẽ xoá)
on:
  push:
    branches: [claude/project-thread-5aw179]
    paths: ['.github/workflows/test_full.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install python-calamine openpyxl lxml msal requests
      - name: Cài LibreOffice bản mới nhất (để giữ công thức, định dạng)
        # Bản 24.2 có sẵn trên Ubuntu đọc sai hàm XLOOKUP trong .xlsb, nên tải bản mới nhất.
        # Nếu tải lỗi, bước đổi sẽ tự dùng bản chỉ giá trị.
        continue-on-error: true
        run: |
          V=$(curl -fsL https://download.documentfoundation.org/libreoffice/stable/ | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "LibreOffice $V"
          curl -fsSL -o lo.tgz "https://download.documentfoundation.org/libreoffice/stable/$V/deb/x86_64/LibreOffice_${V}_Linux_x86-64_deb.tar.gz"
          tar xzf lo.tgz
          sudo dpkg -i LibreOffice_*_deb/DEBS/*.deb > /dev/null
          ls -d /opt/libreoffice*/program/soffice

      - run: |
          python - <<'PY'
          import io, time, openpyxl, excel_convert as xc
          d = open('DMS_Input.xlsx', 'rb').read()
          t = time.time()
          out, used = xc.convert(d, '.xlsb')
          print('KQ', used, len(out), round(time.time() - t), 's')
          wb = openpyxl.load_workbook(io.BytesIO(out))
          print('openpyxl đọc được; sheet:', len(wb.sheetnames))
          import zipfile
          print([n for n in zipfile.ZipFile(io.BytesIO(out)).namelist() if 'comment' in n or 'pivot' in n or 'vml' in n])
          PY
