name: TEST LibreOffice xlsb (tạm, sẽ xoá)
on:
  push:
    branches: [claude/project-thread-5aw179]
    paths: ['.github/workflows/test_lo.yml', 'lo_check.py']
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install python-calamine openpyxl lxml
      - name: Cài LibreOffice bản mới nhất
        run: |
          V=$(curl -s https://download.documentfoundation.org/libreoffice/stable/ | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | grep -oE '[0-9.]+[0-9]' | sort -V | tail -1)
          echo "LibreOffice $V"
          curl -sL -o lo.tgz "https://download.documentfoundation.org/libreoffice/stable/$V/deb/x86_64/LibreOffice_${V}_Linux_x86-64_deb.tar.gz"
          tar xzf lo.tgz && sudo dpkg -i LibreOffice_*_deb/DEBS/*.deb > /dev/null
          ls /opt | grep -i libre
      - name: Đổi và so sánh
        run: |
          SOFF=$(ls -d /opt/libreoffice*/program/soffice | head -1); $SOFF --version
          mkdir -p in out && cp DMS_Input.xlsx in/DMS.xlsb
          time $SOFF --headless --norestore --convert-to xlsx --outdir out in/DMS.xlsb
          python lo_check.py in/DMS.xlsb out/DMS.xlsx
